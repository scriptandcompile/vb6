[package]
name = "vb6compile"
version = "0.1.0"
edition = "2021"
authors = ["Arthur <scriptandcompile@gmail.com>"]
license = "MIT"
description = "VB6 compiler - compile VB6 to native code or other languages"
repository = "https://github.com/scriptandcompile/vb6"
keywords = ["vb6", "visual-basic", "compiler", "code-generation"]
categories = ["development-tools", "compilers"]

[[bin]]
name = "vb6compile"
path = "src/main.rs"

[dependencies]
vb6parse.workspace = true
vb6semantic.workspace = true
vb6runtime.workspace = true
vb6core.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true

# For code generation
heck.workspace = true  # Case conversions
indoc.workspace = true  # Indented string literals

# For formatting generated code
rustfmt-wrapper.workspace = true

# Optional LLVM backend
inkwell = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
pretty_assertions.workspace = true

[features]
default = ["rust-backend"]
rust-backend = []
llvm-backend = ["inkwell", "vb6core/llvm"]
javascript-backend = []
all-backends = ["rust-backend", "llvm-backend", "javascript-backend"]

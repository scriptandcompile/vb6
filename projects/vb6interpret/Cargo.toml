[package]
name = "vb6interpret"
version = "0.1.0"
edition = "2024"
authors = ["Arthur <scriptandcompile@gmail.com>"]
license = "MIT"
description = "VB6 interpreter for executing VB6 code directly"
repository = "https://github.com/scriptandcompile/vb6"
keywords = ["vb6", "visual-basic", "interpreter", "runtime"]
categories = ["development-tools", "compilers"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vb6interpret"
path = "src/main.rs"

[dependencies]
vb6parse.workspace = true
vb6semantic.workspace = true
vb6runtime.workspace = true
vb6core.workspace = true
jiff.workspace = true
ariadne.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true

# For performance monitoring
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
serde_json.workspace = true
data-url = "0.3.2"
base64.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# For REPL
rustyline = { workspace = true, optional = true }
colored = { workspace = true, optional = true }

# Tauri (optional, for native form/menu rendering)
tauri = { workspace = true, optional = true }

[build-dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
base64.workspace = true
web-sys = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[features]
default = ["tauri"]
repl = ["dep:rustyline", "dep:colored"]
trace = ["tracing", "tracing-subscriber"]
wasm = ["vb6runtime/wasm", "dep:web-sys"]
tauri = ["vb6runtime/tauri", "dep:tauri"]

[lints]
workspace = true

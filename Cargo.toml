[workspace]
resolver = "2"
members = [
    "projects/aspen",
    "projects/vb6parse",
    "projects/vb6convert",
    "projects/vb6semantic",
    "projects/vb6runtime",
    "projects/vb6core",
    "projects/vb6interpret",
    "projects/vb6compile",
    "projects/vb6codegen",
    "projects/vb6libraries",
    "projects/vb6format",
    "projects/vb6grammarfuzz",
    "projects/vb6harness",
    #"projects/vb6lsp",
    #"projects/vscode-vb6"
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/scriptandcompile/vb6"
authors = ["ScriptAndCompile"]

[workspace.dependencies]
# Shared dependencies across workspace members
vb6parse = { path = "projects/vb6parse", version = "1.2.2" }
vb6semantic = { path = "projects/vb6semantic", version = "0.1.0" }
vb6runtime = { path = "projects/vb6runtime", version = "0.1.0" }
vb6core = { path = "projects/vb6core", version = "0.1.0" }
vb6codegen = { path = "projects/vb6codegen", version = "0.1.0" }
vb6format = { path = "projects/vb6format", version = "0.1.0" }
vb6interpret = { path = "projects/vb6interpret", version = "0.1.0" }

# Errors / CLI / serialization
anyhow = "1.0.104"
thiserror = "2.0.20"
clap = { version = "4.6.5", features = ["cargo", "derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"
either = { version = "1.17.0", features = ["serde"] }

# Filesystem / traversal
walkdir = "2.5"
tempfile = "3.8"
assert_fs = "1.0"
predicates = "3.0"

# Concurrency / testing / benchmarking
rayon = "1.10"
criterion = "0.8.2"
insta = { version = "1.48.0", features = ["yaml"] }
assert_matches = { version = "1.5.0" }
pretty_assertions = "1.4"

# Diagnostics
ariadne = "0.6.0"
colored = "3.1.1"

# Parsing (vb6parse)
uuid = "1.24.0"
image = "0.25.10"
num_enum = "0.7.6"
strum = "0.28.0"
strum_macros = "0.28.0"
encoding_rs = "0.8.35"
phf = { version = "0.14.0", features = ["macros"] }
rowan = "0.17.0"

# Runtime / numeric / datetime (vb6runtime)
num-traits = "0.2"
jiff = "0.2.35"

# Code generation (vb6compile, vb6codegen)
heck = "0.4"
indoc = "2.0"
rustfmt-wrapper = "0.2"
inkwell = { version = "0.4", default-features = false, features = ["llvm16-0"] }

# Fuzzing (vb6grammarfuzz)
rand = "0.10.0"

# REPL / tracing (vb6interpret)
rustyline = "17.0.2"
tracing = "0.1"
tracing-subscriber = "0.3"

# WASM bindings
wasm-bindgen = "0.2.126"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
wasm-bindgen-test = "0.3.76"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.samply]
inherits = "release"
debug = true
strip = false

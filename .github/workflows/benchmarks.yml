name: Update VB6Parse Benchmarks

on:
  push:
    branches: [master]
    paths:
      - 'projects/vb6parse/src/**'
      - 'projects/vb6parse/benches/**'
      - 'scripts/generate-benchmarks.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

      - name: Generate benchmarks
        run: python3 scripts/generate-benchmarks.py --project vb6parse

      - name: Install Git LFS
        run: git lfs install

      - name: Commit and push if changed
        run: |
          git pull --rebase --autostash
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/assets/data/vb6parse/benchmarks.json docs/assets/data/vb6parse/benchmarks-history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update benchmark data"
            git push
          fi

name: Build Playground WASM

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/playground-wasm.yml'
      - 'scripts/generate-playground.py'
      - 'projects/vb6parse/**'
      - 'projects/vb6semantic/**'
      - 'projects/vb6interpret/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      parse: ${{ steps.filter.outputs.parse }}
      semantic: ${{ steps.filter.outputs.semantic }}
      interpret: ${{ steps.filter.outputs.interpret }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect WASM targets
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            parse:
              - '.github/workflows/playground-wasm.yml'
              - 'projects/vb6parse/**'
              - '!projects/vb6parse/tests/**'
              - '!projects/vb6parse/benches/**'
              - '!projects/vb6parse/examples/**'
              - '!projects/vb6parse/README.md'
              - '!projects/vb6parse/CHANGELOG.md'
              - '!projects/vb6parse/CONTRIBUTING.md'
              - '!projects/vb6parse/docs/**'
            semantic:
              - '.github/workflows/playground-wasm.yml'
              - 'projects/vb6semantic/**'
              - '!projects/vb6semantic/README.md'
              - '!projects/vb6semantic/LICENSE'
              - '!projects/vb6semantic/docs/**'
            interpret:
              - '.github/workflows/playground-wasm.yml'
              - 'projects/vb6interpret/**'
              - '!projects/vb6interpret/README.md'
              - '!projects/vb6interpret/docs/**'

  wasm:
    needs: detect
    if: needs.detect.outputs.parse == 'true' || needs.detect.outputs.semantic == 'true' || needs.detect.outputs.interpret == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install wasm-opt
        run: cargo install wasm-opt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Show build tool versions
        run: |
          rustc --version
          cargo --version
          wasm-pack --version
          wasm-opt --version
          python3 --version

      - name: Build changed WASM modules
        env:
          BUILD_PARSE: ${{ needs.detect.outputs.parse }}
          BUILD_SEMANTIC: ${{ needs.detect.outputs.semantic }}
          BUILD_INTERPRET: ${{ needs.detect.outputs.interpret }}
        run: |
          set -euo pipefail

          if [[ "$BUILD_PARSE" == "true" ]]; then
            echo "Building vb6parse WASM"
            python3 scripts/generate-playground.py --project vb6parse --optimize
          fi

          if [[ "$BUILD_SEMANTIC" == "true" ]]; then
            echo "Building vb6semantic WASM"
            python3 scripts/generate-playground.py --project vb6semantic --optimize
          fi

          if [[ "$BUILD_INTERPRET" == "true" ]]; then
            echo "Building vb6interpret WASM"
            python3 scripts/generate-playground.py --project vb6interpret --optimize
          fi

      - name: Upload WASM to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VB6PARSE_VERSION || 'v1.2.4' }}
          files: |
            docs/vb6parse/assets/wasm/vb6parse_bg.wasm
            docs/vb6semantic/assets/wasm/vb6semantic_bg.wasm
            docs/vb6interpret/assets/wasm/vb6interpret_bg.wasm
          fail_on_unmatched_files: true
          prerelease: true
          body: |
            Playground WASM binaries for vb6parse, vb6semantic, and vb6interpret.
            
            These files are served from GitHub Releases because GitHub Pages
            does not support LFS (the WASM files are tracked via LFS in
            the repository).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Git LFS
        run: git lfs install

      - name: Commit and push if changed
        env:
          BUILD_PARSE: ${{ needs.detect.outputs.parse }}
          BUILD_SEMANTIC: ${{ needs.detect.outputs.semantic }}
          BUILD_INTERPRET: ${{ needs.detect.outputs.interpret }}
        run: |
          set -euo pipefail
          git clean -fd docs/vb6parse/assets/wasm/ docs/vb6semantic/assets/wasm/ docs/vb6interpret/assets/wasm/
          git pull --rebase --autostash
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [[ "$BUILD_PARSE" == "true" ]]; then
            git add -f docs/vb6parse/assets/wasm/
          fi

          if [[ "$BUILD_SEMANTIC" == "true" ]]; then
            git add -f docs/vb6semantic/assets/wasm/
          fi

          if [[ "$BUILD_INTERPRET" == "true" ]]; then
            git add -f docs/vb6interpret/assets/wasm/
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update playground WASM assets"
            git push
          fi

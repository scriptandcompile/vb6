name: Update Coverage

on:
  push:
    branches: [master]
    paths:
      - 'projects/vb6parse/src/**'
      - 'projects/vb6parse/tests/**'
      - 'projects/vb6parse/scripts/generate-coverage.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate coverage
        run: python3 projects/vb6parse/scripts/generate-coverage.py

      - name: Commit and push if changed
        run: |
          git pull --rebase --autostash
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/assets/data/coverage.json docs/assets/data/stats.json docs/assets/data/coverage-history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update coverage data [skip ci]"
            git push
          fi
